name: CD demo (manual)

# Despliega la demo a AWS solo cuando alguien lo ejecuta a mano desde la pestaña Actions.
# Requiere secretos en GitHub: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, DEMO_JWT_SECRET.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: sam build --template-file demo/template.yaml
      - run: >
          sam deploy --stack-name rfha-demo --resolve-s3
          --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides JwtSecret=${{ secrets.DEMO_JWT_SECRET }}
