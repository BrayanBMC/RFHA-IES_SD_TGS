name: CD demo (manual)

# Despliega la demo a AWS solo cuando alguien lo ejecuta a mano desde la pestaña Actions.
# Usa el mismo script que se usa en local: scripts/deploy_aws.py (no necesita SAM CLI).
# Requiere secretos en GitHub: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, DEMO_JWT_SECRET.
on:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: "Modo demostración: 1 = botones de simulación visibles (solo para ensayar), 0 = apagados"
        type: choice
        options: ['0', '1']
        default: '0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Desplegar la demo
        env:
          JWT_SECRET: ${{ secrets.DEMO_JWT_SECRET }}
        run: python scripts/deploy_aws.py demo --profile none --region us-east-2 --demo-mode ${{ inputs.demo_mode }}
