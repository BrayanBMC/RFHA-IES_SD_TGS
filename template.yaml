AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RFHA-IES - App final (stack rfha-app). Lambda + HTTP API + DynamoDB

# Se despliega con: python scripts/deploy_aws.py app   (arma build/app y crea el stack)

Parameters:
  JwtSecret:                           # firma de los tokens del estudiante (no se guarda en git)
    Type: String
    NoEcho: true
    MinLength: 32
  AdminKey:                            # clave del administrador general (no se guarda en git)
    Type: String
    NoEcho: true
    MinLength: 16

Resources:
  AppApi:                              # puerta de entrada pública
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  NodesTable:                          # catálogo de nodos y hash de su API Key (HU-01, HU-02)
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: node_id
          AttributeType: S
      KeySchema:
        - AttributeName: node_id
          KeyType: HASH

  RecordsTable:                        # historiales sincronizados por los nodos (HU-03)
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: record_key
          AttributeType: S
      KeySchema:
        - AttributeName: record_key
          KeyType: HASH

  TokensTable:                         # tokens emitidos y lista negra (HU-04, HU-05)
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:         # DynamoDB borra el registro cuando el token vence
        AttributeName: ttl
        Enabled: true

  AppFunction:                         # el middleware de la app final
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rfha-app
      CodeUri: build/app
      Handler: src.app.main.handler
      Runtime: python3.12
      MemorySize: 1024                 # más memoria = más CPU: PBKDF2 de hasta 100 estudiantes por carga
      Timeout: 29                      # tope de API Gateway: 30 s
      Environment:
        Variables:
          REPOSITORY_BACKEND: dynamodb
          NODES_TABLE: !Ref NodesTable
          RECORDS_TABLE: !Ref RecordsTable
          TOKENS_TABLE: !Ref TokensTable
          JWT_SECRET: !Ref JwtSecret
          ADMIN_KEY: !Ref AdminKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppApi
            Path: /
            Method: ANY
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref AppApi
            Path: /{proxy+}
            Method: ANY

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rfha-app
      RetentionInDays: 7

Outputs:
  AppUrl:
    Description: Dirección pública de la app final (abrir /registro-nodo)
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com
  NodesTableName:
    Description: Tabla DynamoDB de nodos
    Value: !Ref NodesTable
  RecordsTableName:
    Description: Tabla DynamoDB de historiales
    Value: !Ref RecordsTable
  TokensTableName:
    Description: Tabla DynamoDB de tokens y lista negra
    Value: !Ref TokensTable
